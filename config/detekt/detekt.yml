build:
  maxIssues: 10

complexity:
  CyclomaticComplexMethod:
    threshold: 20
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
  LargeClass:
    active: true
    threshold: 600

style:
  MagicNumber:
    active: true
    ignoreNumbers: "-1,0,1,2,100,1000"
  MaxLineLength:
    active: true
    maxLineLength: 140
  UnusedPrivateMember:
    active: true
  WildcardImport:
    active: true
    excludeImports:
      - "org.junit.Assert.*"
      - "org.mockito.kotlin.*"

naming:
  FunctionNaming:
    active: true
  TopLevelPropertyNaming:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: true
