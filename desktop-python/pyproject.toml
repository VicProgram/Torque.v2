[project]
name = "torque-desktop"
version = "0.1.0"
description = "Torque Workshop — Python desktop client for workshop management"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008", "F403", "UP046"]
